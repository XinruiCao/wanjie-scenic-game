name: Base build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:base
      - uses: actions/upload-artifact@v4
        with:
          name: wanjie-h5-base
          path: dist/build/h5/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wanjie-douyin-base
          path: dist/douyin/
          if-no-files-found: error
