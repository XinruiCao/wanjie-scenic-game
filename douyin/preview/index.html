<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9e7dc"><title>万界景区 · 抖音小游戏试玩</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dce2de;color:#29444a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:64px;padding:28px;background:radial-gradient(ellipse at 20% 20%,#f1efdf,transparent 70%)}aside{max-width:315px}aside small{font-size:11px;letter-spacing:3px}h1{font:34px/1.5 "Songti SC",serif;margin:20px 0}aside p{font-size:14px;line-height:2;color:#637c7e}aside .note{border-top:1px solid #b7c4c0;padding-top:20px;font-size:12px}#device{position:relative;width:390px;height:min(844px,calc(100svh - 56px));min-height:568px;overflow:hidden;box-shadow:0 24px 100px #2b414d2e;outline:1px solid #778e8a50;background:#f1eee5;touch-action:none}canvas{width:100%;height:100%;display:block}#controls{position:absolute;inset:0;pointer-events:none}#controls button{position:absolute;pointer-events:none;opacity:0;border:0;margin:0;padding:0;background:transparent;font-size:14px}#controls button:focus-visible{opacity:1;border:2px solid #37788a;outline:3px solid #fff8d0;color:transparent;background:#6eacbb11}dialog{border:1px solid #779497;max-width:340px;padding:25px;background:#f6f2e7;color:#29444a}dialog::backdrop{background:#132b2cc9}dialog h2{font:24px serif}dialog p{line-height:1.8}dialog menu{padding:0;display:flex;gap:12px}dialog button{min-height:44px;flex:1;border:1px solid #72918f;background:#315f69;color:#f8f3e7}#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:760px){main{padding:0;background:#f1eee5}aside{display:none}#device{width:100vw;max-width:460px;height:100svh;min-height:0;box-shadow:none;outline:0}}
</style></head>
<body><main><aside><small>WORLDS UNLOCKED</small><h1>把每一次选择，<br>带进新的世界。</h1><p>万界景区 · 抖音小游戏试玩<br>竖屏剧情 / 多重分支 / 双重外观</p><p>纸白是新的开始。<br>通关序章，开启余烬鎏金的另一面。</p><p class="note">这是小游戏界面的浏览器预览。<br>第一卷 35 段图文剧情，正式影像待接入。<br>抖音平台能力需在开发者工具及真机验证。</p></aside><div id="device"><canvas aria-label="万界景区互动剧情" role="img"></canvas><div id="controls" aria-label="游戏操作"></div><div id="live" aria-live="polite"></div></div></main>
<dialog><h2></h2><p></p><menu><button value="cancel">继续当前</button><button value="confirm">开启旅程</button></menu></dialog>
<style>#controls button{pointer-events:auto}</style>
<script type="module" src="./main.ts"></script></body></html>
